name: Release Novisto fork

on:
  push:
    tags:
      - 'v*-novisto.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Check tag matches gradle.properties version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(sed -n 's/^version=//p' gradle.properties)
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "Tag $TAG does not match gradle.properties version $VERSION" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build with Gradle
        run: ./gradlew build

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          JAR="build/libs/plugin-bts-jira-cloud-${VERSION}.jar"
          test -f "$JAR" || { echo "Missing $JAR" >&2; exit 1; }
          git log -1 --format=%B > release-notes.txt
          gh release create "$TAG" "$JAR" --title "$TAG" --notes-file release-notes.txt
